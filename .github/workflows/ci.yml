name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ruff check
        run: |
          python -m pip install ruff
          ruff check .

  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install light test dependencies
        # Deliberately minimal: unit-marked modules must never require torch,
        # numpy, or Qt. huggingface-hub is pinned to match requirements.txt
        # (hf_auth_service uses HfFolder, removed in hub 1.x).
        run: python -m pip install pytest pyyaml requests "huggingface-hub==0.36.0"
      - name: Run dependency-light unit tests
        # qt/pipeline modules self-skip via pytest.importorskip guards.
        run: python -m pytest -q -m unit tests/

  qt-pipeline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libdbus-1-3 libpulse0
      - name: Install heavy test dependencies (CPU torch)
        # CPU-only torch is a CI test vehicle, not a supported product
        # target (HANDOFF decision D2).
        run: |
          python -m pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest pyyaml requests "huggingface-hub==0.36.0" \
            faster-whisper ffmpeg-python soundfile Pillow psutil tqdm \
            "opencv-python-headless<4.12" numpy PySide6 gradio
      - name: Run qt and pipeline tests (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -m "qt or pipeline" tests/

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: CLI Help Smoke
        run: |
          python main.py --help
          python main.py serve --help
          python main.py qt --help
      - name: Compile Smoke
        run: python -m compileall -q main.py app.py utils.py models.py diarization.py diar_backends.py services ui_qt
      - name: Listener Script Syntax
        run: bash -n scripts/run_listener.sh
      - name: Pytest Smoke
        run: |
          python -m pip install pytest
          pytest -q tests/smoke_cli.py
