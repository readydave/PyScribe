name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ruff check
        run: |
          python -m pip install ruff
          ruff check .

  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install light test dependencies
        # Deliberately minimal: these modules must never require torch,
        # numpy, or Qt. huggingface-hub is pinned to match requirements.txt
        # (hf_auth_service uses HfFolder, removed in hub 1.x).
        run: python -m pip install pytest pyyaml requests "huggingface-hub==0.36.0"
      - name: Run dependency-light unit tests
        run: >
          python -m pytest -q
          tests/test_config_service.py
          tests/test_granite_speech_service.py
          tests/test_launcher.py
          tests/test_listener_and_diar_backends.py
          tests/test_llm_connection_service.py
          tests/test_model_catalog.py
          tests/test_prompt_templates_and_config.py
          tests/test_security_hardening.py

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: CLI Help Smoke
        run: |
          python main.py --help
          python main.py serve --help
          python main.py qt --help
      - name: Compile Smoke
        run: |
          python -m py_compile \
            main.py app.py services/logging_service.py \
            services/config_service.py services/model_service.py services/transcription_service.py \
            services/prompt_template_service.py services/llm_connection_service.py services/llm_postprocess_service.py \
            ui_qt/main_window.py ui_qt/benchmark_dialog.py ui_qt/llm_connection_dialog.py ui_qt/llm_postprocess_dialog.py
      - name: Listener Script Syntax
        run: bash -n scripts/run_listener.sh
      - name: Pytest Smoke
        run: |
          python -m pip install pytest
          pytest -q tests/smoke_cli.py
