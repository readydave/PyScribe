[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyscribe"
version = "0.1.0"
description = "Local transcription app with Qt and Gradio listener modes."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "PolyForm-Noncommercial-1.0.0" }
authors = [{ name = "PyScribe Contributors" }]

[project.scripts]
pyscribe = "main:main"

[tool.setuptools]
py-modules = [
  "main",
  "app",
  "utils",
  "models",
  "diarization",
  "diar_backends",
]

[tool.setuptools.packages.find]
include = ["services*", "ui_qt*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# E501 (line length) deferred to the Phase 5 ruff ratchet; enforcing it now
# would churn files Phase 2 is about to restructure.
ignore = ["E501"]

[tool.pytest.ini_options]
markers = [
  "unit: dependency-light tests (stdlib + pyyaml/requests/huggingface-hub only)",
  "qt: tests requiring PySide6 (run offscreen in CI)",
  "pipeline: tests requiring heavy ML deps (torch, gradio, soundfile)",
]

[tool.ruff.lint.per-file-ignores]
# Package __init__ modules may re-export names for the public API.
"__init__.py" = ["F401"]
# pytest.importorskip guards must run before the guarded imports.
"tests/*" = ["E402"]
# String annotations reference lazily-imported heavy modules (PIL, numpy)
# that are intentionally not imported at module level.
"services/multimodal_service.py" = ["F821"]
# sys.path setup must precede repo imports in the test bootstrap.
"tests/test_launcher.py" = ["E402"]
